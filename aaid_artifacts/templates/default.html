<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; line-height: 1.7; color: #1a1a2e; background: #fff; }
    .cover { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 80px; border-bottom: 4px solid #2563eb; page-break-after: always; }
    .logo-slot { width: 160px; height: 60px; background: #e5e7eb; border-radius: 6px; margin-bottom: 60px; display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 13px; }
    .cover h1 { font-size: 42px; font-weight: 700; color: #1a1a2e; line-height: 1.2; margin-bottom: 20px; max-width: 700px; }
    .cover .meta { font-size: 14px; color: #6b7280; margin-top: 12px; }
    .cover .project-tag { display: inline-block; background: #2563eb; color: white; padding: 4px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; margin-bottom: 24px; }
    .content { max-width: 860px; margin: 0 auto; padding: 60px 80px; }
    h1, h2, h3, h4, h5, h6 { font-weight: 700; line-height: 1.3; color: #1a1a2e; margin-top: 2em; margin-bottom: 0.6em; }
    h1 { font-size: 32px; border-bottom: 2px solid #e5e7eb; padding-bottom: 12px; }
    h2 { font-size: 24px; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; }
    h3 { font-size: 20px; } h4 { font-size: 17px; }
    p { margin-bottom: 1em; }
    a { color: #2563eb; text-decoration: none; } a:hover { text-decoration: underline; }
    strong { font-weight: 700; } em { font-style: italic; }
    ul, ol { margin: 0.5em 0 1em 1.5em; } li { margin-bottom: 0.3em; }
    li > ul, li > ol { margin-top: 0.3em; margin-bottom: 0; }
    blockquote { border-left: 4px solid #2563eb; padding: 8px 20px; margin: 1em 0; background: #f0f6ff; border-radius: 0 6px 6px 0; color: #374151; }
    code { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 13px; background: #f3f4f6; padding: 2px 6px; border-radius: 4px; color: #dc2626; }
    pre { background: #1e293b; border-radius: 8px; padding: 20px 24px; overflow-x: auto; margin: 1em 0 1.5em; }
    pre code { background: none; padding: 0; color: #e2e8f0; font-size: 13px; border-radius: 0; }
    table { width: 100%; border-collapse: collapse; margin: 1em 0 1.5em; font-size: 14px; }
    th { background: #1e293b; color: #fff; text-align: left; padding: 10px 14px; font-weight: 600; }
    td { padding: 9px 14px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
    tr:nth-child(even) td { background: #f9fafb; } tr:hover td { background: #f0f6ff; }
    hr { border: none; border-top: 1px solid #e5e7eb; margin: 2em 0; }
    @media print {
      body { font-size: 13px; }
      .cover { min-height: auto; padding: 60px; }
      .content { padding: 40px 60px; }
      pre { background: #f8fafc; color: #1e293b; border: 1px solid #e5e7eb; }
      pre code { color: #1e293b; }
      a { color: #1a1a2e; }
    }
  </style>
</head>
<body>
  <div class="cover">
    <div class="logo-slot">Your Logo Here</div>
    <span class="project-tag">{{project_name}}</span>
    <h1>{{title}}</h1>
    <p class="meta">Generated by aaidlc &middot; {{date}}</p>
  </div>
  <div class="content">
    {{content}}
  </div>
</body>
</html>
