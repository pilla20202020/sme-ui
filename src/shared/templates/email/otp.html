<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Code</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f6f9; font-family:Arial, Helvetica, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="padding:32px 12px; background-color:#f4f6f9;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" border="0"
                    style="width:100%; max-width:600px; background:#ffffff; border:1px solid #e5e7eb; border-radius:12px; padding:32px;">

                <tr>
                    <td>
                        <p style="margin:0 0 16px; font-size:16px; font-weight:700; color:#111827;">
                            Hi {{$member_name}},
                        </p>

                        <p style="margin:0 0 20px; font-size:14px; line-height:22px; color:#374151;">
                            Use the verification code below to continue your enrollment process.
                        </p>

                        <div style="text-align:center; margin:32px 0;">
                            <div style="display:inline-block; padding:16px 32px; background:#f3f4f6; border:1px solid #d1d5db; border-radius:10px;">
                                <span style="font-size:32px; font-weight:700; letter-spacing:8px; color:#111827;">
                                    {{$otp}}
                                </span>
                            </div>
                        </div>


                        <p style="margin:0 0 24px; font-size:14px; line-height:22px; color:#374151;">
                            If you did not request this code, please ignore this email.
                        </p>

                        <p style="margin:0; font-size:14px; line-height:22px; color:#374151;">
                            Thank you,<br>
                            <strong>Corenroll Team</strong>
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>

</body>
</html>
